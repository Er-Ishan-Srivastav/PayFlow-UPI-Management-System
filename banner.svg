  <text x="1140" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">UPI</text>

  <!-- payment successful card -->
  <rect x="980" y="245" width="200" height="70" rx="10" fill="#052e1c" stroke="#16a34a"/>
  <text x="995" y="269" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4ade80">✓ Payment Successful</text>
  <text x="995" y="290" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">₹2,500</text>
  <text x="995" y="306" font-family="Arial, sans-serif" font-size="9.5" fill="#94a3b8">Txn ID: TXN20260914084521</text>

  <!-- bottom quote -->
  <text x="1170" y="340" font-family="Georgia, serif" font-style="italic" font-size="12.5" fill="#94a3b8" text-anchor="end">"Not just a demo.</text>
  <text x="1170" y="357" font-family="Georgia, serif" font-style="italic" font-size="12.5" fill="#94a3b8" text-anchor="end">A database story in action."</text>

  <!-- github handle -->
  <text x="40" y="385" font-family="Arial, sans-serif" font-size="12.5" fill="#94a3b8">⌥ github.com/Er-Ishan-Srivastav/PayFlow-UPI-Management-System</text>
</svg>
