  <rect x="878" y="50" width="144" height="286" rx="8" fill="url(#phoneScreen)"/>
  <text x="950" y="74" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Send Money</text>

  <circle cx="902" cy="104" r="15" fill="#0ea5e9"/>
  <text x="902" y="109" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">RS</text>
  <text x="924" y="109" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">rahul@upi</text>

  <text x="950" y="138" font-family="Arial, sans-serif" font-size="15" fill="#22c55e" text-anchor="middle">&#8595;</text>

  <text x="950" y="160" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">ishan@upi</text>
  <text x="950" y="192" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">₹2,500</text>

  <rect x="890" y="212" width="120" height="32" rx="8" fill="#22c55e"/>
  <text x="950" y="233" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Send</text>

  <text x="950" y="265" font-family="Arial, sans-serif" font-size="9.5" fill="#86efac" text-anchor="middle">🛡 Transaction secured with ACID</text>

  <!-- arcs -->
  <path d="M 700 195 Q 785 140 866 195" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M 1034 195 Q 1085 140 1132 195" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- left db icon -->
  <g transform="translate(660,205)">
    <ellipse cx="20" cy="6" rx="20" ry="6" fill="#1e293b" stroke="#475569"/>
    <rect x="0" y="6" width="40" height="18" fill="#1e293b" stroke="#475569"/>
    <ellipse cx="20" cy="24" rx="20" ry="6" fill="#1e293b" stroke="#475569"/>
  </g>

  <!-- right UPI badge -->
