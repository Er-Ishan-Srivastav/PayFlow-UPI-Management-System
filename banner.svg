  <text x="73" y="80" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">P</text>

  <!-- title -->
  <text x="122" y="76" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">PayFlow <tspan fill="#22c55e">UPI</tspan></text>

  <!-- tagline -->
  <text x="124" y="108" font-family="Arial, sans-serif" font-size="18" fill="#7dd3fc">Simulate. Transact. Learn. Build for Real.</text>

