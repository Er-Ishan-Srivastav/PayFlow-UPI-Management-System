    <text x="54" y="161">✅  ACID Compliant</text>

    <rect x="214" y="136" width="176" height="40" rx="10" fill="#111827" stroke="#334155"/>
    <text x="228" y="161">🗄️  Secure &amp; Scalable</text>

    <rect x="400" y="136" width="196" height="40" rx="10" fill="#111827" stroke="#334155"/>
    <text x="414" y="161">📊  Data-Driven Insights</text>

    <rect x="606" y="136" width="200" height="40" rx="10" fill="#111827" stroke="#334155"/>
    <text x="620" y="161">🧩  Built with Flask &amp; MySQL</text>
