  <!-- top-right quote -->
  <text x="1170" y="38" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#94a3b8" text-anchor="end">Same Flows.</text>
  <text x="1170" y="56" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#94a3b8" text-anchor="end">Real Concepts.</text>
  <text x="1170" y="74" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#94a3b8" text-anchor="end">Stronger Foundations.</text>

